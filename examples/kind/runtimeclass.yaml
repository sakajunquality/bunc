apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: bunc
handler: bunc
---
apiVersion: v1
kind: Pod
metadata:
  name: bunc-web
spec:
  runtimeClassName: bunc
  automountServiceAccountToken: false
  enableServiceLinks: false
  containers:
    - name: web
      image: docker.io/library/bunc-web:kind
      imagePullPolicy: Never
      env:
        - name: BUNC_TEST_EXIT
          value: "1"
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: 8080
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
